version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: assignment3_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=orders_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: assignment3_rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  order_service:
    build: 
      context: ./order_service
    container_name: assignment3_order_service
    ports:
      - "8080:8080"
    env_file:
      - ./order_service/.env
    depends_on:
      postgres:
        condition: service_healthy
      payment_service:
        condition: service_started

  payment_service:
    build: 
      context: ./payment_service
    container_name: assignment3_payment_service
    ports:
      - "50051:50051"
    env_file:
      - ./payment_service/.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification_service:
    build: 
      context: ./notification_service
    container_name: assignment3_notification_service
    env_file:
      - ./notification_service/.env
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  rabbitmq_data: